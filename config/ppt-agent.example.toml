workspace = "./workspace"

[server]
host = "127.0.0.1"
port = 8000
production = false

[providers]
mode = "deterministic"
adapter_id = "volcengine_ark"
# Required with mode = "cloud". The API key belongs in ARK_API_KEY or a Secret file.
multimodal_model_id = "doubao-seed-2-1-pro-260915"
image_model_id = "doubao-seedream-5-0-pro-260628"

# Legacy provider settings below remain readable for rollback only.
deepseek_base_url = "https://api.deepseek.com"
seedream_base_url = "https://ark.cn-beijing.volces.com/api/v3"
qwen_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
deepseek_model = "deepseek-chat"
seedream_model = "doubao-seedream-4-0-250828"
qwen_vision_model = "qwen-vl-max"
qwen_ocr_model = "qwen-vl-ocr-latest"
seedream_result_hosts = []
pricing_currency = "CNY"
pricing_version = "deterministic-v1"
deepseek_input_per_million = 0
deepseek_output_per_million = 0
deepseek_cached_input_per_million = 0
seedream_per_image = 0
qwen_input_per_million = 0
qwen_output_per_million = 0

[runtime]
global_concurrency = 4
project_concurrency = 2
font_roots = ["C:/Windows/Fonts", "/usr/share/fonts", "/usr/local/share/fonts"]
# chromium_executable = "C:/path/to/chrome.exe"

[authentication]
# token_file = "./secrets/access-token"
