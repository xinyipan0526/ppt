[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ppt-agent"
version = "0.1.0"
description = "A local-first, production-oriented image-based PPT agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "Pillow>=11,<13",
  "playwright>=1.49,<2",
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
  "python-pptx>=1.0,<2",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ppt_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live_provider: opt-in tests that can call and charge a real provider account",
]

[tool.coverage.run]
branch = true
source = ["ppt_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
